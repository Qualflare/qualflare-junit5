name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 11 is the compile floor and 21 is the current LTS. 17 is in between and is what
        # Platform 6.x requires at runtime, so all three legs matter.
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - run: mvn -B -ntp verify

  compatibility:
    name: JUnit ${{ matrix.junit }} / Surefire ${{ matrix.surefire }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims one build serves Platform 1.12 through 6.x. This job is what
        # checks that. 1.12 is the floor because fileEntryPublished does not exist
        # before it.
        #
        # The surefire column matters independently of the junit one. Surefire 3.5.4
        # changed launcher-session scoping: up to 3.5.3 each re-run opened its own session
        # (and so got its own listener instance), from 3.5.4 one session covers them all.
        # Both have to produce the same report, so the last leg pins a pre-3.5.4 Surefire
        # against current JUnit to keep that path covered.
        include:
          - junit: '5.12.2'
            platform: '1.12.2'
            java: '17'
            surefire: '3.5.6'
          - junit: '5.13.4'
            platform: '1.13.4'
            java: '17'
            surefire: '3.5.6'
          - junit: '6.1.3'
            platform: '6.1.3'
            java: '17'
            surefire: '3.5.6'
          - junit: '6.1.3'
            platform: '6.1.3'
            java: '17'
            surefire: '3.5.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and install the reporter
        run: mvn -B -ntp -q install -DskipTests

      - name: Run the fixture against JUnit ${{ matrix.junit }} on Surefire ${{ matrix.surefire }}
        run: |
          # Read the version from the ROOT pom rather than letting the fixture fall back
          # to its default. That default went stale the moment `versions:set` produced
          # 0.1.0, and this job spent four commits red resolving 0.1.0-SNAPSHOT.
          VERSION="$(cd ../../.. && mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          mvn -B -ntp -q test \
            -Dqualflare.version="$VERSION" \
            -Dsurefire.version=${{ matrix.surefire }} \
            -Djunit.jupiter.version=${{ matrix.junit }} \
            -Djunit.platform.version=${{ matrix.platform }}
        working-directory: test/integration/fixture

      - name: Serial and parallel reports must match
        # A reporter that is correct only when tests run one at a time is not correct.
        # This is also what catches a lost attempt or a label on the wrong test.
        run: python3 test/integration/verify.py
        env:
          SUREFIRE_VERSION: ${{ matrix.surefire }}
          JUNIT_JUPITER_VERSION: ${{ matrix.junit }}
          JUNIT_PLATFORM_VERSION: ${{ matrix.platform }}
